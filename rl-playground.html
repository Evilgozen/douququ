<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RL 小球实验室 · 电子斗蛐蛐</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #e8efff; background: radial-gradient(circle at 20% 0%, #18284a 0, #090d18 45%, #05070c 100%); }
      header { height: 66px; display: flex; align-items: center; padding: 0 28px; border-bottom: 1px solid rgba(147,171,220,.15); background: rgba(5,8,16,.72); backdrop-filter: blur(12px); }
      header a { color: #9eb1d4; text-decoration: none; font-size: 14px; }
      header strong { margin-left: 22px; font-size: 18px; color: #fff; }
      .tag { margin-left: 12px; border: 1px solid #315d8b; border-radius: 99px; padding: 3px 9px; color: #6ad8ff; font-size: 11px; letter-spacing: .08em; }
      main { width: min(1240px, calc(100% - 40px)); margin: 30px auto; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; }
      .stage-card, .panel { border: 1px solid rgba(139,167,221,.16); border-radius: 20px; background: rgba(11,16,29,.82); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      .stage-card { padding: 18px; min-width: 0; }
      canvas { display: block; width: 100%; border-radius: 14px; aspect-ratio: 9 / 7; }
      .stage-note { display: flex; justify-content: space-between; padding: 14px 6px 0; color: #8293b2; font-size: 13px; }
      .panel { padding: 24px; }
      h1 { margin: 0; font-size: 25px; }
      .intro { margin: 10px 0 24px; color: #8fa1c3; font-size: 14px; line-height: 1.65; }
      label { display: block; color: #9aacca; font-size: 12px; margin-bottom: 7px; }
      input { width: 100%; border: 1px solid #293654; border-radius: 10px; padding: 10px 12px; background: #090e1b; color: #fff; font-size: 15px; outline: none; }
      .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
      button { border: 1px solid #2b3a59; border-radius: 10px; padding: 11px 9px; background: #111a2d; color: #dce8ff; cursor: pointer; font-size: 14px; }
      button:hover { background: #18243c; }
      button.primary { grid-column: 1 / -1; border-color: #187fb0; background: linear-gradient(135deg, #0878a9, #1b55b4); color: white; font-weight: 700; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 22px 0; }
      .stat { border: 1px solid rgba(132,160,215,.12); border-radius: 12px; padding: 11px; background: rgba(7,11,21,.6); }
      .stat span { display: block; color: #7587a7; font-size: 11px; }
      .stat strong { display: block; margin-top: 5px; color: #75dcff; font-size: 20px; }
      #rlStatus { min-height: 44px; border-left: 2px solid #32bde8; padding: 4px 0 4px 12px; color: #b7c7e5; font-size: 13px; line-height: 1.55; }
      .formula { margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(139,167,221,.12); color: #7285a7; font: 12px/1.7 ui-monospace, monospace; }
      @media (max-width: 850px) { main { grid-template-columns: 1fr; } .panel { order: -1; } }
    </style>
  </head>
  <body>
    <header><a href="/">← 返回出片机</a><strong>RL 小球实验室</strong><span class="tag">Q-LEARNING</span></header>
    <main>
      <section class="stage-card">
        <canvas id="rlStage" width="900" height="700"></canvas>
        <div class="stage-note"><span>● 智能体</span><span>★ 目标：+10</span><span>撞墙：-3 · 每步：-0.1</span></div>
      </section>
      <aside class="panel">
        <h1>让小球找到星星</h1>
        <p class="intro">训练初期，小球随机探索；随着 Q 表积累经验，它会逐渐学会绕开墙壁并选择最短路线。</p>
        <label for="episodeTarget">训练局数（episodes）</label>
        <input id="episodeTarget" type="number" min="1" step="100" value="2000" />
        <div class="buttons">
          <button id="train" class="primary">开始训练</button>
          <button id="demo">演示策略</button>
          <button id="reset">清空 Q 表</button>
        </div>
        <div class="stats">
          <div class="stat"><span>EPISODE</span><strong id="episode">0</strong></div>
          <div class="stat"><span>EPSILON</span><strong id="epsilon">1.000</strong></div>
          <div class="stat"><span>本局步数</span><strong id="steps">0</strong></div>
          <div class="stat"><span>本局奖励</span><strong id="reward">0.0</strong></div>
        </div>
        <div id="rlStatus">等待开始训练</div>
        <div class="formula">Q(s,a) ← Q(s,a) + α[r + γ max Q(s′,a′) − Q(s,a)]<br />α = 0.15 · γ = 0.95</div>
      </aside>
    </main>
    <script type="module" src="/src/ui/rlPlayground.ts"></script>
  </body>
</html>

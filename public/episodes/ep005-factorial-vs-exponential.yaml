id: ep005-factorial-vs-exponential
title: 阶乘 VS 指数
subtitle: 高数课噩梦成真·每刀必掉血
seed: 1123581321
combat: { mode: arcade } # 历史剧本；出新片前改成 readable 并重写机制
script: default

fighters:
  # 阶乘：连击序列就是 n!（1,2,6,24,120,720）——爆发狂野但每轮结束回到 1
  - id: factorial
    name: 阶乘
    hp: 32000
    atk: 6
    atkInterval: 0.72
    speed: 150
    combo: [1, 2, 6, 24, 120, 720]

  # 指数：每刀翻倍（1,2,4,8,16,32,64）——没有爆发顶点，但永远在涨
  - id: exponential
    name: 指数
    hp: 32000
    atk: 48
    atkInterval: 0.68
    speed: 165
    combo: [1, 2, 4, 8, 16, 32, 64]

twists:
  # 终局：双方攻击力集体翻倍（临界时刻）
  - trigger: { timeAt: 24.5, fighter: factorial }
    banner: "全体狂暴"
    caption: "临界点！双方攻击力集体翻倍"
    slowmo: 1.3
    effect: { type: berserk, atkMultiplier: 2 }
  - trigger: { timeAt: 24.9, fighter: exponential }
    banner: "指数狂暴"
    effect: { type: berserk, atkMultiplier: 2 }

  # 中段解说
  - trigger: { timeAt: 15 }
    caption: "阶乘刚打完 720 倍的一刀，又要从 1 重新爬"

captions:
  - { t: 4.6,  text: "数学系巅峰对决：阶乘 VS 指数" }
  - { t: 8,    text: "阶乘的连击：1, 2, 6, 24, 120, 720" }
  - { t: 12,   text: "指数每刀翻倍，稳得可怕" }
  - { t: 16,   text: "阶乘在赌：爆发完从 1 重来，指数从不回头" }
  - { t: 20,   text: "这就是高数课的两大魔王" }
  - { t: 28,   text: "狭路相逢，勇者胜？不，是增长快者胜" }


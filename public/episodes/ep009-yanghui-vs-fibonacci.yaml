  desc: "数学公式打起来了！杨辉三角扔三角形数弹幕，斐波那契报数 1 1 2 3 5 8 越扔越大。残血杨辉触发第10行中央项 C(10,5)=252 倍攻击，斐波那契倒下还能靠'数列没有尽头'复活——黄金分割 1.618 对决二项式展开，谁赢？"

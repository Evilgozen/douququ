id: ep009-yanghui-vs-fibonacci
title: 杨辉三角 VS 斐波那契
subtitle: 数学史同门内战·斐波那契二番战：中央项 252 倍 VS 数列不死
seed: 1202                # 斐波那契《计算之书》出版年
combat: { mode: arcade } # 历史剧本；出新片前改成 readable 并重写机制
script: default

physics:
  knockback: 0.4

# 数学史冷知识：斐波那契数列就是把杨辉三角沿斜线相加得到的——师出同门，今日内战
# 杨辉三角 = 风筝法师：三角形数弹幕 + 抛物线"二项式展开"，残血 C(10,5)=252 倍反转
# 斐波那契 = 报数狂人：追击近战 + 数字轮盘 1 1 2 3 5 8...越扔越大，死后"数列没有尽头"复活
fighters:
  - id: yanghui
    name: 杨辉三角
    behavior: random            # 阵法师拉开距离洒弹幕
    sprite: sprites/yanghui.png
    stateSprites:
      berserk: sprites/yanghui-berserk.png
    hp: 1400
    atk: 30
    atkInterval: 1.0
    speed: 150
    radius: 84
    range: 230
    combo: [1, 3, 3, 1]         # 第4行系数：1 3 3 1，两个 3 按暴击演出
    skills:
      - { name: 对称守恒, every: 8, multiplier: 1.5, healPct: 0.05 }
    weapon: { name: 二项式展开, kind: projectile, damage: 130, every: 4.5, speed: 430, arc: true }
    takeout:
      every: 2.0
      speed: 380
      items:                     # 三角形数 C(n,2)：杨辉三角斜线上的 3 6 10 15 21
        - { name: "3", damage: 30, sprite: sprites/num-3.png }
        - { name: "6", damage: 42, sprite: sprites/num-6.png }
        - { name: "10", damage: 56, sprite: sprites/num-10.png }
        - { name: "15", damage: 72, sprite: sprites/num-15.png }
        - { name: "21", damage: 90, sprite: sprites/num-21.png }

  - id: fibonacci
    name: 斐波那契
    behavior: chase             # 螺旋逼近的报数狂人
    sprite: sprites/fibonacci.png
    stateSprites:
      berserk: sprites/fibonacci-revive.png
    hp: 1900
    atk: 38
    atkInterval: 1.1
    speed: 135
    radius: 86
    range: 210
    combo: [1, 1, 2, 3, 5]      # 数列即连击：3 和 5 按暴击演出
    skills:
      - { name: 黄金螺线, every: 8, multiplier: 1.618, healPct: 0.05 }
    weapon: { name: 黄金螺线拳, kind: melee, damage: 105, every: 5, reachMult: 1.9 }
    takeout:
      every: 2.0
      speed: 400
      items:                     # 数列本体：伤害就是斐波那契项，越扔越大
        - { name: "1", damage: 1, sprite: sprites/num-1.png }
        - { name: "1", damage: 1, sprite: sprites/num-1.png }
        - { name: "2", damage: 2, sprite: sprites/num-2.png }
        - { name: "3", damage: 3, sprite: sprites/num-3.png }
        - { name: "5", damage: 5, sprite: sprites/num-5.png }
        - { name: "8", damage: 8, sprite: sprites/num-8.png }
        - { name: "13", damage: 13, sprite: sprites/num-13.png }
        - { name: "21", damage: 21, sprite: sprites/num-21.png }
        - { name: "34", damage: 34, sprite: sprites/num-34.png }
        - { name: "55", damage: 55, sprite: sprites/num-55.png }

twists:
  - trigger: { timeAt: 10, fighter: fibonacci }
    effect: { type: statMultiply, atkMultiplier: 1.5, targets: self }
    banner: 数列爬坡
    caption: 斐波那契越报越大，21、34、55 全在路上
    slowmo: 0.6
  - trigger: { hpBelowPct: 0.16, fighter: yanghui }
    effect:
      type: berserk
      atkMultiplier: 252        # C(10,5) = 252，第10行中央项：一击必杀
      durationHits: 1
      healPct: 0.32
      speedMultiplier: 1.25
    banner: "C(10,5)=252"
    caption: 第10行中央项展开，杨辉攻击力乘 252！
    slowmo: 1.2
  - trigger: { fighterDead: fibonacci }
    effect:
      type: revive
      hpPct: 0.26               # 复活血量 494
      speedMultiplier: 1.15
    banner: 数列没有尽头
    caption: "1 1 2 3 5 8 13……数列复活了，永远还有下一项"
    slowmo: 0.8

timeLimit: 55

captions:
  - { t: 0.5, text: 今天黑板没人擦，数学公式自己打起来了, dur: 3 }
  - { t: 4.6, text: 红方杨辉三角，每一行都是二项式系数, dur: 3 }
  - { t: 8.2, text: 蓝方斐波那契，开场就报数：1 1 2 3 5 8, dur: 3.5 }
  - { t: 12.5, text: 斜着加我就能得到他，今天偏要正面刚, dur: 3 }
  - { t: 17, text: 数字挠痒，拳头要命，杨辉被按在黑板上打, dur: 3 }
  - { t: 19.8, text: 注意看杨辉的血条，只剩最后一行了, dur: 2.8 }
  - { t: 23.5, text: 252 倍是什么概念？第10行正中间那个数, dur: 3.5 }
  - { t: 27, text: 数列复活了，可杨辉的弹幕还在飞, dur: 3 }
  - { t: 31, text: 最后一课：别惹会展开的男人, dur: 3 }

narration:
  provider: volc
  voice: BV002_streaming
  speed: 0.5

audio:
  volume: 1

bgm:
  file: bgm/polka-fast.wav
  vol: 0.9
  duckTo: 0.3

publish:
